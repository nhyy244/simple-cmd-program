[project]
name = "cmd-program"
version = "0.1.0"
description = "Simple command line program"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "art",
    "pytest"
]
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]